spring:
  application:
    name: cs-copilot-service
  profiles:
    active: dev

  # ============= Kafka 配置（ASR 消息消费） =============
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    consumer:
      group-id: copilot-asr-consumer
      auto-offset-reset: latest
      enable-auto-commit: false
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      properties:
        max.poll.records: 50
        session.timeout.ms: 30000
    listener:
      ack-mode: MANUAL_IMMEDIATE
      concurrency: 4

  # ============= Redis 配置（RedisTemplate，默认 Lettuce，生产可切换 Sentinel/Cluster） =============
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0
    timeout: 2000ms
    lettuce:
      pool:
        max-active: 20
        max-idle: 10
        min-idle: 2
        max-wait: 2000ms

  # ============= 数据源（TDSQL PG 兼容库：cs_menu_* 等存量表 + Copilot 新增表） =============
  datasource:
    url: ${DATASOURCE_URL:jdbc:postgresql://localhost:5432/cccs}
    username: ${DATASOURCE_USERNAME:cccs}
    password: ${DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

# ============= Spring Cloud OpenFeign 配置 =============
feign:
  client:
    config:
      ai-intent-client:
        connect-timeout: 1000
        read-timeout: 3000
        logger-level: BASIC
  compression:
    request:
      enabled: true
    response:
      enabled: true

# ============= Resilience4j 熔断（M06 AI 接口） =============
resilience4j:
  circuitbreaker:
    instances:
      aiIntentClient:
        sliding-window-size: 50
        failure-rate-threshold: 50
        slow-call-duration-threshold: 3s
        slow-call-rate-threshold: 80
        permitted-number-of-calls-in-half-open-state: 3
        wait-duration-in-open-state: 30s
        record-exceptions:
          - feign.RetryableException
          - feign.FeignException

# ============= Copilot 业务配置 =============
copilot:
  # ASR 接入
  asr:
    topic: cs.asr.sentences
    concurrency: 4
    min-text-length: 4
    asr-confidence-threshold: 0.65
    # confidence 缺失策略：true=允许通过，false=拒绝
    asr-confidence-default-pass: true
    dedup-ttl-hours: 2
    # 生产要求 Kafka record key = callId，保证同一通话 ASR 进入同一分区
    require-call-id-key: true

  # 意图识别触发窗口（MVP 固定窗口策略）
  # 首条客户句子起算 window-ms 毫秒，到期触发一次意图识别；
  # 窗口期内的句子仅追加到对话历史，不重置 timer。
  intent-trigger:
    window-ms: 5000
    polling-interval-ms: 200
    polling-batch-size: 100
    # fire 抛异常后该通话进入冷却的时长（ms），期间不再开新窗口
    fire-failure-cooldown-ms: 30000

  # 意图树（配置文件，本期固定值）
  intent-tree:
    file: classpath:intent-tree.json
    version: TREE_FIXED_V1

  # AI 接口
  ai:
    url: ${AI_INTENT_URL:http://aicscopilotreplygensop.sk.aipower3.cmbchina.cn}
    connect-timeout-ms: 1000
    read-timeout-ms: 3000

  # URL 白名单
  url-whitelist:
    - frdctrfront.paas.cmbchina.cn
    - mccusweb.paas.cmbchina.cn
    - cccsweb.paas.cmbchina.cn

  # URL Builder 配置（DD-V1.2 P0-5）
  url-builder:
    # 生产环境拦截这些 UAT 域名
    uat-domains:
      - frdctrfront.paasuat.cmbchina.cn
      - mccusweb.paasuat.cmbchina.cn
    # 同名参数冲突策略：OVERRIDE / PRESERVE / ERROR
    same-key-policy: OVERRIDE

  # 指令有效期
  directive:
    expire-seconds: 30

  # 指令有效期
  directive:
    expire-seconds: 30

  # 灰度白名单（DD-V1.2 P1-9，最简方案）
  gray:
    enabled: true
    # 仅这些坐席能收到 Copilot 推荐
    operator-whitelist:
      - ho212121

  # 管理接口鉴权
  admin:
    auth:
      enabled: true
      header-name: X-Copilot-Admin-Token
      token: ${COPILOT_ADMIN_TOKEN:}

  # WebSocket Origin 白名单
  websocket:
    allowed-origin-patterns:
      - https://frdctrfront.paas.cmbchina.cn
      - https://mccusweb.paas.cmbchina.cn
      - https://cccsweb.paas.cmbchina.cn
      - https://frdctrfront.paasuat.cmbchina.cn
      - https://mccusweb.paasuat.cmbchina.cn
    cluster-push-channel: copilot:push:directive
    operator-id-header: X-Copilot-Operator-Id
    operator-id-query-param: operatorId

  # 多 Pod 配置一致性轮询（DD-V1.2 P1-17）
  config-refresh:
    polling-interval-ms: 30000

  # MVP 阶段监控埋点
  metrics:
    # 调用/触发日志先通过应用日志输出；反馈结果写入 ES。
    feedback-async:
      core-size: ${COPILOT_FEEDBACK_ASYNC_CORE_SIZE:2}
      max-size: ${COPILOT_FEEDBACK_ASYNC_MAX_SIZE:4}
      queue-capacity: ${COPILOT_FEEDBACK_ASYNC_QUEUE_CAPACITY:1000}
    feedback-es:
      enabled: ${COPILOT_FEEDBACK_ES_ENABLED:true}
      # 多节点可用逗号分隔，例如 http://es-1:9200,http://es-2:9200
      base-url: ${COPILOT_FEEDBACK_ES_URL:http://localhost:9200}
      index-name: ${COPILOT_FEEDBACK_ES_INDEX:cs-copilot-feedback-log}
      username: ${COPILOT_FEEDBACK_ES_USERNAME:}
      password: ${COPILOT_FEEDBACK_ES_PASSWORD:}
      connect-timeout-ms: ${COPILOT_FEEDBACK_ES_CONNECT_TIMEOUT_MS:1000}
      read-timeout-ms: ${COPILOT_FEEDBACK_ES_READ_TIMEOUT_MS:1000}

  # ============= M03 对话历史管理 =============
  history:
    max-size: 50
    ttl-hours: 1

# ============= 日志配置 =============
logging:
  level:
    root: INFO
    com.cmbchina.cs.assitsvc: INFO
    org.springframework.kafka: WARN
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level [%X{traceId},%X{callId}] %logger{36} - %msg%n"

# ============= Spring Boot Actuator =============
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: when-authorized
